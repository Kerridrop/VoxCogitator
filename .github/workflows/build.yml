name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0). Leave empty to just build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build Cogitator.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: Cogitator-windows
          path: out/Cogitator.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version != '' && inputs.version || github.ref_name }}
        run: gh release create "$TAG" out/Cogitator.exe --target "$GITHUB_SHA" --title "$TAG" --generate-notes
