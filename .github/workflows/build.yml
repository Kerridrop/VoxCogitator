name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0). Leave empty to just build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mono-complete
      - name: Build
        run: |
          mkdir -p out
          mcs -sdk:4.5 -target:winexe -platform:anycpu -optimize+ -codepage:utf8 \
            -win32icon:assets/cog.ico \
            -resource:assets/fonts/FSEX.ttf,FSEX.ttf -resource:assets/fonts/CogDOS.ttf,CogDOS.ttf \
            -r:System.Windows.Forms.dll -r:System.Drawing.dll \
            -out:out/Cogitator.exe src/Cogitator.cs
      - uses: actions/upload-artifact@v4
        with:
          name: Cogitator-windows
          path: out/Cogitator.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version != '' && inputs.version || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          gh release upload "$TAG" out/Cogitator.exe --clobber
